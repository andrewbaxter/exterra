[package]
name = "exterra"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
aargvark = { version = "0", features = ["serde_json"] }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp = "0.8"
rmpv = "1"
rcgen = "0.13"
base64 = "0.22"
anyhow = "1"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-stream = "0.1"
tower = "0.4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"

[lints.clippy]
all = "allow"
